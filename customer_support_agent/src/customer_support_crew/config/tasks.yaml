rag_task:
  description: >
    Receive the customer query: {customer_query}. Search the internal knowledge base using your RAG tool.
  expected_output: >
    An answer if found in internal docs, or a clear statement that the information is missing.
  agent: rag_support_agent

web_search_task:
  description: >
    If the previous agent could not find the answer in internal documentation, search the web to answer: {customer_query}.
  expected_output: >
    A well-sourced answer retrieved from the web.
  agent: web_search_agent
  context:
    - rag_task

sheet_logging_task:
  description: >
    Review all responses generated by the previous support specialists. Take the final resolution summary text 
    and pass it directly to the Google Sheet Logger Tool so that the customer interaction history is recorded.
  expected_output: >
    A confirmation string showing that the row has been appended to the Google Sheet log.
  agent: google_sheet_agent
  context:
    - rag_task
    - web_search_task